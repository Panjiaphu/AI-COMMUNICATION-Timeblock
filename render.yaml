services:
  - type: web
    name: guilua
    runtime: python
    plan: standard
    buildCommand: bash scripts/build_render.sh
    startCommand: bash scripts/start_render.sh
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: PUBLIC_BASE_URL
        value: https://guilua.onrender.com
      - key: TIMEBLOCK_APP_URL
        value: https://timeblock-commercial-pro.onrender.com
      - key: SECRET_KEY
        sync: false
      - key: TIMEBLOCK_API_URL
        sync: false
      - key: TIMEBLOCK_API_KEY
        sync: false
      - key: GUILUA_CLIENT_ID
        value: guilua
      - key: GUILUA_SESSION_COOKIE
        value: guilua_session
      - key: GUILUA_SESSION_TTL_SECONDS
        value: 14400
      - key: GUILUA_PENDING_AUTHORIZATION_TTL_SECONDS
        value: 120
      - key: GUILUA_SESSION_MAX_ENTRIES
        value: 10000
      - key: ALLOW_MISSING_BFF_ORIGIN
        value: false
      - key: ALLOWED_WEBSOCKET_ORIGINS
        value: https://guilua.onrender.com
      - key: ALLOWED_TIMEBLOCK_HANDOFF_ORIGINS
        value: https://timeblock-commercial-pro.onrender.com,https://fumapgo.com
      - key: ALLOW_MISSING_WEBSOCKET_ORIGIN
        value: false
      - key: WEBSOCKET_AUTH_TIMEOUT_SECONDS
        value: 5
      - key: MAX_AUTH_EVENT_BYTES
        value: 16384
      - key: CONNECTION_STALE_SECONDS
        value: 120
      - key: RECONNECT_TOKEN_SECONDS
        value: 300
      - key: ENDED_SESSION_CACHE_SECONDS
        value: 600
      - key: IDEMPOTENCY_CACHE_SECONDS
        value: 1800
