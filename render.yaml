services:
  - type: web
    name: AI-COMMUNICATION-Timeblock
    branch: main
    autoDeployTrigger: off
    runtime: python
    plan: starter
    buildCommand: bash scripts/build_render.sh
    preDeployCommand: bash scripts/predeploy_render.sh
    startCommand: bash scripts/start_render.sh
    healthCheckPath: /readyz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PUBLIC_BASE_URL
        value: https://guilua.onrender.com
      - key: TIMEBLOCK_APP_URL
        value: https://timeblock-commercial-pro.onrender.com
      - key: SECRET_KEY
        sync: false
      - key: TIMEBLOCK_API_URL
        sync: false
      - key: TIMEBLOCK_API_KEY
        sync: false
      - key: TIMEBLOCK_TIMEOUT_SECONDS
        value: 5
      - key: TIMEBLOCK_PROXY_TIMEOUT_SECONDS
        value: 120
      - key: GUILUA_CLIENT_ID
        value: guilua
      - key: GUILUA_SESSION_COOKIE
        value: guilua_session
      - key: GUILUA_PENDING_AUTHORIZATION_COOKIE
        value: guilua_auth_nonce
      - key: GUILUA_SESSION_TTL_SECONDS
        value: 14400
      - key: GUILUA_PENDING_AUTHORIZATION_TTL_SECONDS
        value: 120
      - key: GUILUA_SESSION_MAX_ENTRIES
        value: 10000
      - key: GUILUA_PENDING_AUTHORIZATION_MAX_ENTRIES
        value: 2000
      - key: GUILUA_AUTHORIZATION_START_RATE_LIMIT_COUNT
        value: 12
      - key: GUILUA_AUTHORIZATION_START_RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: ALLOW_MISSING_BFF_ORIGIN
        value: "false"
      - key: MESSAGING_REALTIME_ENABLED
        value: "true"
      - key: MESSAGING_MAILBOX_LOCK_ENABLED
        value: "true"
      - key: MESSAGING_ADVANCED_ATTACHMENTS_ENABLED
        value: "true"
      - key: GROUP_TRANSLATION_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_REALTIME_TRANSLATION_MODEL
        value: gpt-realtime-translate
      - key: OPENAI_REALTIME_TRANSCRIPTION_MODEL
        value: gpt-realtime-whisper
      - key: GROUP_TRANSLATION_MAX_TARGETS
        value: "2"
      - key: GROUP_TRANSLATION_CLIENT_SECRET_TTL_SECONDS
        value: "60"
      - key: GROUP_TRANSLATION_RESERVATION_TTL_SECONDS
        value: "300"
      - key: GROUP_TRANSLATION_MAX_SEGMENT_SECONDS
        value: "300"
      - key: GROUP_TRANSLATION_POLICY_VERSION
        value: group-translation-v3-2026-08-31
      - key: GROUP_V3_ENABLED
        value: "true"
      - key: GROUP_HANDOFF_AUDIENCE
        value: ai-communication-group-v3
      - key: GROUP_HANDOFF_MAX_BYTES
        value: "8192"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "5"
      - key: GROUP_MESSAGE_ENCRYPTION_KEY
        sync: false
      - key: GROUP_ATTACHMENT_MAX_BYTES
        value: "5242880"
      - key: GROUP_MEDIA_ENABLED
        value: "true"
      - key: GROUP_LIVEKIT_URL
        sync: false
      - key: GROUP_LIVEKIT_API_KEY
        sync: false
      - key: GROUP_LIVEKIT_API_SECRET
        sync: false
      - key: GROUP_LIVEKIT_REGION
        value: Singapore
      - key: GROUP_LIVEKIT_TOKEN_TTL_SECONDS
        value: "300"
      - key: GROUP_MEDIA_MAX_PARTICIPANTS
        value: "8"
      - key: GROUP_RADIO_FLOOR_LEASE_SECONDS
        value: "15"
      - key: GROUP_RADIO_V3_ENABLED
        value: "true"
      - key: GROUP_RADIO_REDIS_URL
        sync: false
      - key: GROUP_RADIO_REDIS_NAMESPACE
        value: ai-communication:group-radio:v3
      - key: GROUP_RADIO_HEARTBEAT_SECONDS
        value: "5"
      - key: GROUP_RADIO_DEVICE_LOST_SECONDS
        value: "10"
      - key: GROUP_RADIO_MAX_BURST_SECONDS
        value: "30"
      - key: GROUP_RADIO_MAX_ROOMS
        value: "20"
      - key: ALLOWED_WEBSOCKET_ORIGINS
        value: https://guilua.onrender.com
      - key: ALLOWED_TIMEBLOCK_HANDOFF_ORIGINS
        value: https://timeblock-commercial-pro.onrender.com,https://fumapgo.com
      - key: ALLOW_MISSING_WEBSOCKET_ORIGIN
        value: "false"
      - key: WEBSOCKET_AUTH_TIMEOUT_SECONDS
        value: 5
      - key: MAX_AUTH_EVENT_BYTES
        value: 16384
      - key: CONNECTION_STALE_SECONDS
        value: 120
      - key: RECONNECT_TOKEN_SECONDS
        value: 300
      - key: ENDED_SESSION_CACHE_SECONDS
        value: 600
      - key: IDEMPOTENCY_CACHE_SECONDS
        value: 1800
