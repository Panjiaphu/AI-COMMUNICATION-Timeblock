name: Communication Runtime

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_SOURCE_SHA=$EXPECTED_SOURCE_SHA"
          echo "CHECKED_OUT_SHA=$CHECKED_OUT_SHA"
          if [ "$CHECKED_OUT_SHA" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Checked-out SHA does not match the exact workflow source." >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_legacy_runtime_absence.py
      - run: python -m compileall app
      - run: PYTHONPATH=. pytest -q
      - run: python scripts/check_env.py --phase build
      - run: python -c "from app.main import create_app; app=create_app(); assert app.title == 'Guilua Timeblock AI Assistant'"
