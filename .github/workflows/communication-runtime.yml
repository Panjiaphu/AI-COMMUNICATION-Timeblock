name: Communication Runtime

on:
  pull_request:
    branches: [main]
  push:
    branches: [refactor/communication-runtime-foundation]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_legacy_runtime_absence.py
      - run: python -m compileall app
      - run: PYTHONPATH=. pytest -q
      - run: python scripts/check_env.py --phase build
      - run: python -c "from app.main import create_app; app=create_app(); assert app.title == 'Guilua Communication Runtime'"
